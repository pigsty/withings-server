name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run unit tests
        run: npm run test:unit

      - name: Build project
        run: npm run build

      - name: Build Docker image
        run: docker build -t withings-server:test .

      - name: Run e2e tests
        env:
          WITHINGS_E2E_IMAGE: withings-server:test
        run: npm run test:e2e
